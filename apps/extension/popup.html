<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/><title>创迹 CreatorTrace</title><link rel="stylesheet" href="popup.css"/></head><body>
<header><div class="brand-icon">↗</div><div><strong>创迹 <span>CreatorTrace</span></strong><small>每一次创作，都有迹可循。</small></div><span class="version">MV3</span></header>
<main><span class="eyebrow">从一个创作者，开始研究</span><h1>他的创作故事，<br/>藏在每一次尝试里。</h1>
<div class="profile"><div class="avatar" id="avatar">?</div><div><strong id="creator-name">识别当前页面…</strong><p id="creator-id">打开 B 站创作者空间页面</p></div><span id="detected" hidden>已识别</span></div>
<form id="form"><label for="creator-url">创作者主页链接 / UID</label><input id="creator-url" placeholder="https://space.bilibili.com/123456" required/><button type="submit" class="primary">分析创作轨迹 <span>↗</span></button></form>
<p class="status" id="status" role="status">将在 Dashboard 使用网站公开接口读取该 UID 的数据（实验性）；不读取 Cookie，受限时明确停止。</p>
<button id="demo" class="demo">先看看完整演示案例 <span>→</span></button>
<details><summary>Dashboard 地址设置</summary><label for="dashboard-url">本地开发默认使用 5173 端口</label><input id="dashboard-url" placeholder="http://127.0.0.1:5173"/><button id="save" class="save">保存地址</button><p>使用 npm start 时改为 http://127.0.0.1:3001</p></details>
</main><footer><span>TraceLab · 创作者研究室</span><span>本地优先 / 无后台采集</span></footer><script src="popup.js" type="module"></script></body></html>
